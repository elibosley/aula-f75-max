name: Firmware builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - name: Install host dependencies
        run: brew install make ninja pkg-config glib hidapi libusb
      - name: Install pinned Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-build.lock
      - name: Portable C and UI model tests
        run: |
          make test
          npm test
          .venv/bin/python -m unittest discover -s tests -p test_bootstrap_emulator.py
          .venv/bin/python -m unittest discover -s tests -p test_host_codec.py
          .venv/bin/python scripts/build_preview.py
      - name: Fetch pinned firmware and emulator sources
        run: make bootstrap
      - name: Build twice and verify linked firmware
        run: make verify
      - name: Package firmware and receipts
        run: .venv/bin/python scripts/package_builds.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f75-max-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
